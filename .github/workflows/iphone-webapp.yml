name: Äonenfall iPhone Web-App

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_STATUS: "stable"
  GODOT_BIN: "Godot_v4.7.1-stable_linux.x86_64"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Projektteile zusammensetzen
        shell: bash
        run: |
          set -euo pipefail
          test -f aeonenfall_project.part00
          test -f aeonenfall_project.part01
          test -f aeonenfall_project.part02
          test -f aeonenfall_project.part03
          test -f aeonenfall_project.part04
          cat aeonenfall_project.part* > aeonenfall_project.zip
          rm -rf project
          mkdir -p project
          unzip -q aeonenfall_project.zip -d project
          test -f project/project.godot
          test -f project/scripts/game_state.gd
          test -f project/scripts/music_manager.gd
          test -f project/scripts/scene_transition.gd

      - name: Werkzeuge installieren
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Godot 4.7.1 und Exportvorlagen laden
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl -L --fail --retry 5 --retry-delay 5 -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          rm -rf template_unpack "$TEMPLATE_DIR"
          mkdir -p template_unpack "$TEMPLATE_DIR"
          7z x -y templates.tpz -otemplate_unpack >/dev/null

          for FILE in web_nothreads_debug.zip web_nothreads_release.zip version.txt; do
            SOURCE="$(find template_unpack -type f -name "$FILE" -print -quit)"
            if [ -z "$SOURCE" ]; then
              echo "Exportvorlage fehlt im Paket: $FILE"
              find template_unpack -maxdepth 3 -type f | sort
              exit 1
            fi
            cp "$SOURCE" "$TEMPLATE_DIR/$FILE"
          done

          test -s "$TEMPLATE_DIR/web_nothreads_debug.zip"
          test -s "$TEMPLATE_DIR/web_nothreads_release.zip"
          "./${GODOT_BIN}" --version
          ls -lh "$TEMPLATE_DIR"

      - name: Ressourcen importieren
        shell: bash
        run: |
          set -euo pipefail
          "./${GODOT_BIN}" --headless --path project --import

      - name: Web-App exportieren
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          "./${GODOT_BIN}" --headless --path project --export-release "Web iPhone" "$GITHUB_WORKSPACE/build/web/index.html"
          python3 project/web_support/patch_web_build.py "$GITHUB_WORKSPACE/build/web"
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          touch build/web/.nojekyll
          find build/web -maxdepth 1 -type f -printf '%f %s Bytes\n' | sort

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Web-App-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Downloadbares ZIP erzeugen
        shell: bash
        run: |
          cd build/web
          zip -9 -r ../../Aeonenfall_iPhone_WebApp_v1_12_6.zip .

      - name: Web-App-ZIP als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Aeonenfall-iPhone-WebApp-v1.12.6
          path: Aeonenfall_iPhone_WebApp_v1_12_6.zip
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
